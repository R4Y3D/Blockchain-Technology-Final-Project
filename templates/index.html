<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Blockchain Loans</title>
    <style>
        #verified-badge {
            font-size: 0.7rem;
            letter-spacing: 0.03em;
            padding: 4px 10px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        #verified-badge.is-verified {
            transform: scale(1.08);
        }
        #key-fingerprint {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col-6 mx-auto mt-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>Loans</h1>
                    <a href="{{ url_for('keys') }}" class="btn btn-sm btn-outline-warning">Get My Keys</a>
                </div>

                <form id="loan-form" action="{{ url_for('index') }}" method="POST">

                    <!-- Borrower field with live verification badge and key fingerprint -->
                    <div class="mb-3">
                        <label for="borrower-input" class="form-label d-flex align-items-center gap-2">
                            Borrower
                            <span id="verified-badge" class="badge rounded-pill bg-secondary">
                                ✗ Unverified
                            </span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text" id="borrower-addon">Name</span>
                            <input type="text" class="form-control" id="borrower-input"
                                   aria-describedby="borrower-addon" name="borrower">
                        </div>
                        <!-- Public key fingerprint appears here once a valid key is detected -->
                        <div id="key-fingerprint" class="mt-1 ps-1" style="display:none;">
                            <small class="text-muted" style="font-size:0.75rem;">
                                Key: <span id="key-fingerprint-text" class="font-monospace text-success fw-semibold"></span>
                            </small>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="lender-input" class="form-label">Lender</label>
                        <div class="input-group">
                            <span class="input-group-text" id="lender-addon">Name</span>
                            <input type="text" class="form-control" id="lender-input"
                                   aria-describedby="lender-addon" name="lender">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="amount-input" class="form-label">Amount</label>
                        <div class="input-group">
                            <span class="input-group-text" id="amount-addon">$</span>
                            <input type="text" class="form-control" id="amount-input"
                                   aria-describedby="amount-addon" name="amount">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="private-key-input" class="form-label">
                            Borrower's Private Key
                            <span class="text-muted fw-normal">(optional: signs the transaction)</span>
                            <span id="key-status-badge" class="badge bg-secondary ms-1"
                                  style="font-size:0.68rem;">No Key</span>
                        </label>
                        <textarea class="form-control font-monospace" id="private-key-input"
                                  name="private_key" rows="4"
                                  placeholder="Paste your private key here to sign this transaction..."></textarea>
                        <small class="text-muted">
                            No key? <a href="{{ url_for('keys') }}">Generate one here.</a>
                            Without a key the transaction is saved but unsigned.
                        </small>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>

            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-6 mx-auto mb-5 text-center">

                <div class="d-flex gap-2 justify-content-center mb-3 mt-4">
                    <form action="{{ url_for('check') }}">
                        <button class="btn btn-outline-info">Check Integrity</button>
                    </form>
                    <a href="{{ url_for('chain') }}" class="btn btn-outline-secondary">View Chain</a>
                </div>

                {% for res in checking_results %}
                    <div class="{% if res['result'] == 'Ok' %}text-success{% else %}text-danger{% endif %}">
                        Block {{ res['block'] }}: {{ res['result'] }}
                    </div>
                {% endfor %}

            </div>
        </div>
    </div>

    <script>
        let debounceTimer = null;
        let keyIsValid = false;

        const privateKeyInput  = document.getElementById('private-key-input');
        const verifiedBadge    = document.getElementById('verified-badge');
        const keyFingerprint   = document.getElementById('key-fingerprint');
        const fingerprintText  = document.getElementById('key-fingerprint-text');
        const keyStatusBadge   = document.getElementById('key-status-badge');
        const loanForm         = document.getElementById('loan-form');

        // Extracts the readable base64 content from a PEM string,
        // then returns the first 20 characters followed by "..."
        function truncateKey(pem) {
            const b64 = pem.split('\n')
                           .filter(l => l.trim() && !l.startsWith('---'))
                           .join('');
            return b64.substring(0, 20) + '...';
        }

        function setUnverified() {
            keyIsValid = false;

            verifiedBadge.textContent = '✗ Unverified';
            verifiedBadge.className = 'badge rounded-pill bg-secondary';

            keyFingerprint.style.display = 'none';
            fingerprintText.textContent = '';

            keyStatusBadge.textContent = 'No Key';
            keyStatusBadge.className = 'badge bg-secondary ms-1';
            keyStatusBadge.style.fontSize = '0.68rem';
        }

        function setVerified(publicKey) {
            keyIsValid = true;

            verifiedBadge.textContent = '✓ Verified';
            verifiedBadge.className = 'badge rounded-pill bg-success is-verified';

            fingerprintText.textContent = truncateKey(publicKey);
            keyFingerprint.style.display = 'block';

            keyStatusBadge.textContent = '✓ Key Valid';
            keyStatusBadge.className = 'badge bg-success ms-1';
            keyStatusBadge.style.fontSize = '0.68rem';
        }

        function setInvalid() {
            keyIsValid = false;

            verifiedBadge.textContent = '✗ Unverified';
            verifiedBadge.className = 'badge rounded-pill bg-secondary';

            keyFingerprint.style.display = 'none';
            fingerprintText.textContent = '';

            keyStatusBadge.textContent = '✗ Invalid Key';
            keyStatusBadge.className = 'badge bg-danger ms-1';
            keyStatusBadge.style.fontSize = '0.68rem';
        }

        privateKeyInput.addEventListener('input', function () {
            clearTimeout(debounceTimer);
            const val = this.value.trim();
            if (!val) {
                setUnverified();
                return;
            }

            keyStatusBadge.textContent = '...';
            keyStatusBadge.className = 'badge bg-warning text-dark ms-1';

            debounceTimer = setTimeout(async () => {
                const fd = new FormData();
                fd.append('private_key', val);
                const resp = await fetch('/validate-key', { method: 'POST', body: fd });
                const data = await resp.json();
                if (data.status === 'valid')        setVerified(data.public_key);
                else if (data.status === 'invalid') setInvalid();
                else                                setUnverified();
            }, 400);
        });

        loanForm.addEventListener('submit', function (e) {
            if (!keyIsValid) {
                const proceed = confirm(
                    'Warning: No valid private key provided.\n\n' +
                    'This transaction will be submitted UNSIGNED and UNVERIFIED on the blockchain.\n\n' +
                    'Continue anyway?'
                );
                if (!proceed) e.preventDefault();
            }
        });
    </script>

</body>
</html>
