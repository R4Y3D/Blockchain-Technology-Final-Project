<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Blockchain Loans</title>
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col-6 mx-auto mt-5">
                <h1 class="mb-5">Loans</h1>

                <form action="{{ url_for('index') }}" method="POST">
                    <div class="mb-3">
                        <label for="borrower-input" class="form-label">Borrower</label>
                        <div class="input-group">
                            <span class="input-group-text" id="borrower-addon">Name</span>
                            <input type="text" class="form-control" id="borrower-input" aria-describedby="borrower-addon" name="borrower">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="lender-input" class="form-label">Lender</label>
                        <div class="input-group">
                            <span class="input-group-text" id="lender-addon">Name</span>
                            <input type="text" class="form-control" id="lender-input" aria-describedby="lender-addon" name="lender">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="amount-input" class="form-label">Amount</label>
                        <div class="input-group">
                            <span class="input-group-text" id="amount-addon">$</span>
                            <input type="text" class="form-control" id="amount-input" aria-describedby="amount-addon" name="amount">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>

            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-6 mx-auto mb-5 text-center">

                <div class="d-flex gap-2 justify-content-center mb-3 mt-4">
                    <form action="{{ url_for('check') }}">
                        <button class="btn btn-outline-info">Check Integrity</button>
                    </form>
                    <a href="{{ url_for('chain') }}" class="btn btn-outline-secondary">View Chain</a>
                </div>

                {% for res in checking_results %}
                    <div class="{% if res['result'] == 'Ok' %}text-success{% else %}text-danger{% endif %}">
                        Block {{ res['block'] }}: {{ res['result'] }}
                    </div>
                {% endfor %}

            </div>
        </div>
    </div>

</body>
</html>
